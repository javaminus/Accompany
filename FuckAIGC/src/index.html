<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 多功能助手</title>
    <style>
        body {
            margin: 0;
            background: #f4f7f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .container {
            width: 900px;
            height: 95vh;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        /* 顶部标题栏 */
        .header {
            padding: 15px 20px;
            background: #10a37f;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 聊天区 */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fbff;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.ai .avatar { background: #10a37f; margin-right: 12px; }
        .message.ai .avatar::after { content: "🤖"; }
        .message.ai .content {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            color: #333;
            border-radius: 0 15px 15px 15px;
        }

        .message.user { flex-direction: row-reverse; }
        .message.user .avatar { background: #4a90e2; margin-left: 12px; }
        .message.user .avatar::after { content: "👤"; }
        .message.user .content {
            background: #10a37f;
            color: #ffffff;
            border-radius: 15px 0 15px 15px;
        }

        .content {
            max-width: 75%;
            padding: 12px 16px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .copy-btn {
            display: block;
            margin-top: 8px;
            background: transparent;
            border: 1px solid #10a37f;
            color: #10a37f;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover { background: #10a37f; color: #fff; }

        /* 输入区 */
        .footer {
            padding: 20px;
            border-top: 1px solid #eee;
            background: #fff;
        }

        .options-bar {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .lang-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 14px;
            outline: none;
            background: #fff;
            cursor: pointer;
        }

        .input-box {
            display: flex;
            background: #f7f7f8;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            border: none;
            background: transparent;
            resize: none;
            font-size: 15px;
            outline: none;
            padding: 5px;
            min-height: 30px;
            max-height: 200px;
            line-height: 1.5;
        }

        .send-btn {
            background: #10a37f;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
            margin-left: 10px;
        }

        .send-btn:hover { opacity: 0.8; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>AI 助手</span>
        <span style="font-size: 12px; font-weight: normal; opacity: 0.8;">Local Backend Mode</span>
    </div>

    <!-- 聊天记录 -->
    <div class="chat" id="chat">
        <div class="message ai">
            <div class="avatar"></div>
            <div class="content">
                你好！请选择左下角的<b>“功能接口”</b>，然后输入文字。
                <br>• 如果是润色接口，请记得选择目标语言。
                <br>• 如果是摘要或语法接口，只需输入文本即可。
            </div>
        </div>
    </div>

    <!-- 底部输入 -->
    <div class="footer">
        <div class="options-bar">
            <!-- 接口选择 -->
            <div class="option-group">
                <label style="font-size: 14px; color: #666;">功能接口：</label>
                <select id="api-select" class="lang-select" onchange="toggleLangSelect()">
                    <option value="polish">论文润色 (双参数: text+lang)</option>
                    <option value="io">AI编程 (单参数: text)</option>
                </select>
            </div>

            <!-- 语言选择 (仅在润色时有意义) -->
            <div class="option-group" id="lang-group">
                <label style="font-size: 14px; color: #666;">目标语言：</label>
                <select id="lang-select" class="lang-select">
                    <option value="CN">中文 (Chinese)</option>
                    <option value="EN">英文 (English)</option>
                </select>
            </div>
        </div>

        <div class="input-box">
            <textarea id="input" rows="1" placeholder="在此粘贴或输入论文片段..." oninput="autoHeight(this)"></textarea>
            <button class="send-btn" id="send-btn" onclick="send()">发送</button>
        </div>
    </div>
</div>

<script>
    /**
     * 接口配置表：
     * 如果你新增了接口，只需在这里添加一行。
     * - url: 后端地址
     * - paramName: 接收字符串的参数名 (如 userInput, text, data)
     * - needLang: 是否需要带上语言参数 lang
     */
    const API_CONFIG = {
        "polish": {
            url: "http://127.0.0.1:8080/chat",
            paramName: "userInput",
            needLang: true
        },
        "io": {
            url: "http://127.0.0.1:8080/io",
            paramName: "userInput",
            needLang: false
        }
    };

    // 根据选择的功能决定是否显示“语言选择”框
    function toggleLangSelect() {
        const apiType = document.getElementById('api-select').value;
        const langGroup = document.getElementById('lang-group');
        // 如果该配置需要语言参数，则显示下拉框，否则隐藏
        langGroup.style.display = API_CONFIG[apiType].needLang ? 'flex' : 'none';
    }

    // 自动调整输入框高度
    function autoHeight(elem) {
        elem.style.height = 'auto';
        elem.style.height = (elem.scrollHeight) + 'px';
    }

    // 添加消息到 UI
    function addMsg(role, text) {
        const chat = document.getElementById('chat');
        const msg = document.createElement('div');
        msg.className = 'message ' + role;

        const avatar = document.createElement('div');
        avatar.className = 'avatar';

        const content = document.createElement('div');
        content.className = 'content';

        const textNode = document.createElement('div');
        textNode.textContent = text;
        content.appendChild(textNode);

        if (role === 'ai') {
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = '复制全文';
            btn.onclick = () => {
                navigator.clipboard.writeText(text).then(() => {
                    btn.textContent = '已复制！';
                    setTimeout(() => btn.textContent = '复制全文', 2000);
                });
            };
            content.appendChild(btn);
        }

        msg.appendChild(avatar);
        msg.appendChild(content);
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
    }

    // 发送逻辑
    async function send() {
        const input = document.getElementById('input');
        const apiSelect = document.getElementById('api-select');
        const langSelect = document.getElementById('lang-select');
        const sendBtn = document.getElementById('send-btn');

        const text = input.value.trim();
        const apiType = apiSelect.value;
        const lang = langSelect.value;

        if (!text) return;

        // 获取当前接口的配置
        const config = API_CONFIG[apiType];

        // UI 处理
        addMsg('user', text);
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = true;

        try {
            // 1. 构建 URL 基础部分
            let url = `${config.url}?${config.paramName}=${encodeURIComponent(text)}`;

            // 2. 如果配置需要语言参数，额外拼接 lang
            if (config.needLang) {
                url += `&lang=${lang}`;
            }

            console.log("Requesting URL:", url);

            // 3. 发起请求
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

            const data = await res.json();

            // 4. 解析结果 (兼容各种常见的后端返回字段)
            let reply = data.data || data.result || data.output || JSON.stringify(data);
            addMsg('ai', reply);

        } catch (err) {
            console.error(err);
            addMsg('ai', `❌ 请求失败: ${err.message}。请确保后端已启动并配置了 CORS 跨域。`);
        } finally {
            sendBtn.disabled = false;
        }
    }

    // 回车发送
    document.getElementById('input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });

    // 初始化显示状态
    toggleLangSelect();
</script>

</body>
</html>
